<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Elements with Default Values</title>
</head>
<body>
    <form action="#">
       
        <label for="text">Text Input:</label>
        <input type="text" id="text" name="text" value="Default Text"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="reshma@gmail.com"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" value="password123"><br><br>

        <label for="number">Number:</label>
        <input type="number" id="number" name="number" value="10" min="1" max="100"><br><br>

      
        <label for="checkbox">Checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox" checked><br><br>

        <label for="radio">Radio:</label>
        <input type="radio" id="radio1" name="radio" value="option1" checked> Option 1
        <input type="radio" id="radio2" name="radio" value="option2"> Option 2<br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="2025-04-30"><br><br>

    
        <label for="file">File Input:</label>
        <input type="file" id="file" name="file"><br><br>

      
        <input type="submit" value="Submit">
    </form>
</body>
</html>
